
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>GSA Web Category Checker</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  style.css

  <!-- MSAL Browser (Auth Code + PKCE) -->
  https://alcdn.msauth.net/browser/2.38.0/js/msal-browser.min.js</script>

  <!-- Auth config and app logic -->
  authConfig.js</script>
  app.js</script>
</head>
<body>
  <header>
    <h1>Microsoft Entra Global Secure Access</h1>
    <h2>Web Category Checker</h2>
  </header>

  <main>
    <section class="auth">
      <button id="signin">Sign in</button>
      <button id="signout" disabled>Sign out</button>
      <div id="user-info"></div>
      <div id="status"></div>
    </section>

    <section class="form">
      <label for="urlInput">Enter a URL:</label>
      <input id="urlInput" type="url" placeholder="https://example.com" />
      <button id="checkBtn" disabled>Check category</button>
    </section>

    <section class="results">
      <h3>Result</h3>
      <pre id="resultPane">Sign in to run the check.</pre>
    </section>
  </main>

  <footer>
    <small>Powered by Microsoft Graph (beta) – Network Access</small>
  </footer>
</body>
</html>
